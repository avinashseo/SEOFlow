name: SEOFlow Tests

on:
  push:
    branches: 
      - main
      - develop

  pull_request: 
    branches
      - main


jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
      
      - name: Install Dependencies
        run: 
          python -m pip install --upgrade
          pip install -r requierements.txt

      - name: Run tests
        run: 
          pytests